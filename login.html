<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dim Dim Bank - Login</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/logcad.css">
    <script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/cleave.min.js"></script>
</head>
<body class="login-bg">
    <nav>
        <a href="index.html">
            <img class="navLogo" src="imgs/logo.png" alt="Logo">
        </a>
    </nav>
    
    <form id="loginForm">
        <img src="imgs/profile.png" alt="Profile">
        <br>
        
        <div id="loginInputs">
            <input class="cpf-mask" placeholder="CPF" type="text" id="cpfCnpj" required>
            <br>
            <input placeholder="Senha" type="password" id="password" required>
            <br>
            <div class="links">
                <a class="toggleLoginInputs">Esqueceu sua senha?</a>
                <a href="cadastro.html">Não possui uma conta?</a>
            </div>
            <br>
            <button type="submit" class="btn">Entrar</button>
        </div>
        
        <div id="esqueceuInputs" style="display: none;">
            <input placeholder="Email cadastrado" type="email">
            <br>
            <div class="links">
                <a class="toggleLoginInputs">Voltar para Login</a>
            </div>
            <br>
            <button type="button" class="btn" onclick="alert('Um email de recuperação foi enviado!')">Recuperar</button>
        </div>
    </form>

    <script src="script/User.js"></script>
    <script src="script/logcad.js"></script>
</body>
</html>
